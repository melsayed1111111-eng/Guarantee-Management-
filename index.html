<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1022" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="إدارة الضمانات" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>إدارة ضمانات الأجهزة</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg-1: #0b1022;
    --bg-2: #1a1f4a;
    --bg-3: #4a1f6e;
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.18);
    --glass-strong: rgba(255, 255, 255, 0.14);
    --text: #f5f7ff;
    --text-muted: rgba(245, 247, 255, 0.7);
    --text-dim: rgba(245, 247, 255, 0.5);
    --accent: #7c5cff;
    --accent-2: #00d4ff;
    --success: #10d97a;
    --warning: #ffb547;
    --danger: #ff5c7a;
    --radius: 18px;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 800px at 10% 0%, rgba(124, 92, 255, 0.45), transparent 60%),
      radial-gradient(900px 600px at 90% 10%, rgba(0, 212, 255, 0.35), transparent 60%),
      radial-gradient(1000px 700px at 50% 100%, rgba(255, 92, 122, 0.28), transparent 60%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2) 60%, var(--bg-3));
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom);
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 85% 25%, rgba(255,255,255,0.25), transparent);
    pointer-events: none;
    z-index: 0;
  }
  .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 24px; }

  header.app-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 18px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-logo {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(124, 92, 255, 0.4);
  }
  .brand-logo svg { width: 26px; height: 26px; color: white; }
  .brand-text h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0.2px; }
  .brand-text p { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }

  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    appearance: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 700;
    padding: 11px 18px; border-radius: 12px;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    color: white;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #5b3fd8);
    box-shadow: 0 8px 22px rgba(124, 92, 255, 0.4);
  }
  .btn-ghost {
    background: var(--glass-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
  }
  .btn-danger {
    background: linear-gradient(135deg, #ff5c7a, #d63a5c);
    box-shadow: 0 8px 22px rgba(255, 92, 122, 0.35);
  }
  .btn svg { width: 18px; height: 18px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: ""; position: absolute; top: -40px; left: -40px;
    width: 120px; height: 120px; border-radius: 50%;
    background: var(--g, radial-gradient(circle, rgba(124,92,255,0.25), transparent 70%));
    pointer-events: none;
  }
  .stat-label { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
  .stat-value { font-size: 30px; font-weight: 800; }
  .stat-card.total .stat-value { color: var(--accent-2); }
  .stat-card.active .stat-value { color: var(--success); }
  .stat-card.soon .stat-value { color: var(--warning); }
  .stat-card.expired .stat-value { color: var(--danger); }

  .toolbar {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  .search-input {
    flex: 1; min-width: 220px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--text); font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.2s, background 0.2s;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }

  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 9px 14px; font-size: 13px; font-weight: 600;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 999px; cursor: pointer;
    color: var(--text-muted); transition: all 0.15s;
  }
  .chip:hover { color: var(--text); background: rgba(255,255,255,0.1); }
  .chip.active {
    background: linear-gradient(135deg, var(--accent), #5b3fd8);
    color: white; border-color: transparent;
    box-shadow: 0 4px 14px rgba(124,92,255,0.4);
  }

  .devices-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
  }
  .device-card {
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow);
    position: relative;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .device-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.28); }
  .device-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .device-icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, rgba(124,92,255,0.3), rgba(0,212,255,0.25));
    border: 1px solid var(--glass-border);
  }
  .device-icon svg { width: 24px; height: 24px; color: white; }
  .device-title { flex: 1; }
  .device-title h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .device-title span { font-size: 12px; color: var(--text-muted); }
  .device-meta { display: grid; gap: 8px; margin-bottom: 14px; }
  .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 6px 0;
    border-bottom: 1px dashed rgba(255,255,255,0.08);
  }
  .meta-row:last-child { border-bottom: none; }
  .meta-label { color: var(--text-muted); }
  .meta-value { font-weight: 600; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; padding: 6px 12px;
    border-radius: 999px; border: 1px solid transparent;
  }
  .badge-active { background: rgba(16,217,122,0.15); color: var(--success); border-color: rgba(16,217,122,0.4); }
  .badge-soon { background: rgba(255,181,71,0.15); color: var(--warning); border-color: rgba(255,181,71,0.4); }
  .badge-expired { background: rgba(255,92,122,0.15); color: var(--danger); border-color: rgba(255,92,122,0.4); }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .device-actions { display: flex; gap: 8px; margin-top: 8px; }
  .icon-btn {
    flex: 1;
    appearance: none; border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.05); color: var(--text);
    padding: 9px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.12); }
  .icon-btn.danger:hover { background: rgba(255,92,122,0.18); border-color: rgba(255,92,122,0.5); color: var(--danger); }
  .icon-btn svg { width: 14px; height: 14px; }

  .empty-state {
    text-align: center; padding: 60px 20px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px dashed var(--glass-border);
    border-radius: var(--radius);
    color: var(--text-muted);
  }
  .empty-state svg { width: 64px; height: 64px; opacity: 0.5; margin-bottom: 12px; }
  .empty-state h3 { margin: 0 0 6px; color: var(--text); }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 12, 30, 0.6);
    backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(135deg, rgba(30, 35, 70, 0.85), rgba(40, 25, 80, 0.85));
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 24px;
    max-width: 520px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-title { font-size: 19px; font-weight: 800; margin: 0; }
  .modal-close {
    background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
    color: var(--text); width: 34px; height: 34px; border-radius: 10px;
    cursor: pointer; display: grid; place-items: center;
    font-size: 20px; line-height: 1;
  }
  .form-grid { display: grid; gap: 14px; }
  .form-field label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--text-muted); margin-bottom: 6px;
  }
  .form-field input, .form-field select {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 11px 14px;
    color: var(--text); font-family: inherit; font-size: 14px;
    outline: none; transition: border-color 0.2s, background 0.2s;
  }
  .form-field select option { background: #1a1f4a; color: var(--text); }
  .form-field input:focus, .form-field select:focus {
    border-color: var(--accent); background: rgba(255,255,255,0.1);
  }
  .form-actions {
    display: flex; gap: 10px; justify-content: flex-start;
    margin-top: 18px;
  }
  .form-actions .btn { flex: 1; justify-content: center; }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%) translateY(120%);
    background: rgba(20, 25, 55, 0.95);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 12px 22px; border-radius: 12px;
    font-weight: 600; font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    z-index: 100; transition: transform 0.3s ease;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: rgba(16,217,122,0.5); }
  .toast.error { border-color: rgba(255,92,122,0.5); }

  .install-banner {
    display: none;
    background: linear-gradient(135deg, rgba(124,92,255,0.25), rgba(0,212,255,0.2));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
    align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .install-banner.show { display: flex; }
  .install-banner p { margin: 0; font-size: 14px; }

  @media (max-width: 600px) {
    .container { padding: 14px; }
    header.app-header { padding: 14px 16px; }
    .brand-text h1 { font-size: 17px; }
    .brand-text p { font-size: 12px; }
    .stat-value { font-size: 24px; }
    .header-actions .btn span { display: none; }
    .header-actions .btn { padding: 11px 13px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="app-header">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 5v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11V5l-8-3z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>إدارة ضمانات الأجهزة</h1>
        <p>تتبع ضمانات الكمبيوتر واللاب توب والرامات والطابعات</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="exportBtn" title="تصدير البيانات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>تصدير</span>
      </button>
      <button class="btn btn-ghost" id="importBtn" title="استيراد البيانات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>استيراد</span>
      </button>
      <input type="file" id="importInput" accept="application/json" hidden />
      <button class="btn btn-primary" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>إضافة جهاز</span>
      </button>
    </div>
  </header>

  <div class="install-banner" id="installBanner">
    <p>📱 يمكنك تثبيت التطبيق على جهازك للوصول السريع وبدون إنترنت</p>
    <button class="btn btn-primary" id="installBtn">تثبيت التطبيق</button>
  </div>

  <section class="stats">
    <div class="stat-card total">
      <div class="stat-label">إجمالي الأجهزة</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card active">
      <div class="stat-label">ضمان ساري</div>
      <div class="stat-value" id="statActive">0</div>
    </div>
    <div class="stat-card soon">
      <div class="stat-label">قارب على الانتهاء</div>
      <div class="stat-value" id="statSoon">0</div>
    </div>
    <div class="stat-card expired">
      <div class="stat-label">منتهي الضمان</div>
      <div class="stat-value" id="statExpired">0</div>
    </div>
  </section>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن جهاز، شركة، موظف..." />
    <div class="filter-group" id="filterGroup">
      <button class="chip active" data-filter="all">الكل</button>
      <button class="chip" data-filter="active">ساري</button>
      <button class="chip" data-filter="soon">قارب على الانتهاء</button>
      <button class="chip" data-filter="expired">منتهي</button>
    </div>
  </div>

  <div id="devicesContainer"></div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">إضافة جهاز جديد</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <form id="deviceForm" class="form-grid">
      <input type="hidden" id="deviceId" />
      <div class="form-field">
        <label for="deviceName">اسم الجهاز / الديفايس <span style="color:var(--danger)">*</span></label>
        <input type="text" id="deviceName" required placeholder="مثال: لاب توب Dell Latitude 7420" />
      </div>
      <div class="form-field">
        <label for="deviceType">نوع الجهاز</label>
        <select id="deviceType">
          <option value="laptop">لاب توب</option>
          <option value="desktop">كمبيوتر مكتبي</option>
          <option value="ram">رامات</option>
          <option value="printer">طابعة</option>
          <option value="tablet">تابلت</option>
          <option value="phone">هاتف</option>
          <option value="other">أخرى</option>
        </select>
      </div>
      <div class="form-field">
        <label for="companyName">اسم الشركة <span style="color:var(--danger)">*</span></label>
        <input type="text" id="companyName" required placeholder="مثال: Dell, HP, Lenovo" />
      </div>
      <div class="form-field">
        <label for="purchaseDate">تاريخ الشراء <span style="color:var(--danger)">*</span></label>
        <input type="date" id="purchaseDate" required />
      </div>
      <div class="form-field">
        <label for="warrantyEnd">تاريخ انتهاء الضمان <span style="color:var(--danger)">*</span></label>
        <input type="date" id="warrantyEnd" required />
      </div>
      <div class="form-field">
        <label for="employeeName">اسم موظف المشتريات <span style="color:var(--danger)">*</span></label>
        <input type="text" id="employeeName" required placeholder="اسم الموظف الذي قام بالشراء" />
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">إلغاء</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">حفظ</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ====== Data Layer ======
  const STORAGE_KEY = 'warranty_devices_v1';

  const loadDevices = () => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
    catch { return []; }
  };
  const saveDevices = (list) => localStorage.setItem(STORAGE_KEY, JSON.stringify(list));

  let devices = loadDevices();
  let currentFilter = 'all';
  let currentSearch = '';
  let editingId = null;

  // ====== Helpers ======
  const fmtDate = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
  };
  const daysBetween = (a, b) => Math.ceil((new Date(b) - new Date(a)) / 86400000);
  const warrantyStatus = (end) => {
    const days = daysBetween(new Date(), end);
    if (days < 0) return { key: 'expired', label: 'منتهي', days };
    if (days <= 30) return { key: 'soon', label: `ينتهي خلال ${days} يوم`, days };
    return { key: 'active', label: `ساري (${days} يوم متبقي)`, days };
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const deviceIcons = {
    laptop: '<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>',
    desktop: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
    ram: '<rect x="2" y="8" width="20" height="8" rx="1"/><line x1="6" y1="16" x2="6" y2="20"/><line x1="10" y1="16" x2="10" y2="20"/><line x1="14" y1="16" x2="14" y2="20"/><line x1="18" y1="16" x2="18" y2="20"/>',
    printer: '<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
    tablet: '<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
    phone: '<rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
    other: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>'
  };
  const typeLabels = {
    laptop: 'لاب توب', desktop: 'كمبيوتر مكتبي', ram: 'رامات',
    printer: 'طابعة', tablet: 'تابلت', phone: 'هاتف', other: 'أخرى'
  };

  // ====== Render ======
  const $ = (sel) => document.querySelector(sel);
  const container = $('#devicesContainer');

  const renderStats = () => {
    let active = 0, soon = 0, expired = 0;
    devices.forEach(d => {
      const s = warrantyStatus(d.warrantyEnd).key;
      if (s === 'active') active++;
      else if (s === 'soon') soon++;
      else expired++;
    });
    $('#statTotal').textContent = devices.length;
    $('#statActive').textContent = active;
    $('#statSoon').textContent = soon;
    $('#statExpired').textContent = expired;
  };

  const renderDevices = () => {
    const filtered = devices.filter(d => {
      const status = warrantyStatus(d.warrantyEnd).key;
      if (currentFilter !== 'all' && status !== currentFilter) return false;
      if (currentSearch) {
        const s = currentSearch.toLowerCase();
        return [d.name, d.company, d.employee, typeLabels[d.type] || ''].some(v =>
          (v || '').toLowerCase().includes(s)
        );
      }
      return true;
    }).sort((a, b) => new Date(a.warrantyEnd) - new Date(b.warrantyEnd));

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 12h6M9 16h6M9 8h6"/>
          </svg>
          <h3>${devices.length === 0 ? 'لا توجد أجهزة بعد' : 'لا توجد نتائج'}</h3>
          <p>${devices.length === 0 ? 'ابدأ بإضافة أول جهاز لتتبع الضمان' : 'جرّب تغيير البحث أو الفلتر'}</p>
        </div>`;
      return;
    }

    const html = `<div class="devices-grid">${filtered.map(d => {
      const status = warrantyStatus(d.warrantyEnd);
      const iconPath = deviceIcons[d.type] || deviceIcons.other;
      return `
        <div class="device-card">
          <div class="device-head">
            <div class="device-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPath}</svg>
            </div>
            <div class="device-title">
              <h3>${escapeHtml(d.name)}</h3>
              <span>${typeLabels[d.type] || 'جهاز'}</span>
            </div>
            <span class="badge badge-${status.key}">
              <span class="badge-dot"></span>
              ${status.key === 'active' ? 'ساري' : status.key === 'soon' ? 'قريب الانتهاء' : 'منتهي'}
            </span>
          </div>
          <div class="device-meta">
            <div class="meta-row"><span class="meta-label">الشركة</span><span class="meta-value">${escapeHtml(d.company)}</span></div>
            <div class="meta-row"><span class="meta-label">تاريخ الشراء</span><span class="meta-value">${fmtDate(d.purchaseDate)}</span></div>
            <div class="meta-row"><span class="meta-label">انتهاء الضمان</span><span class="meta-value">${fmtDate(d.warrantyEnd)}</span></div>
            <div class="meta-row"><span class="meta-label">حالة الضمان</span><span class="meta-value" style="color:var(--${status.key === 'active' ? 'success' : status.key === 'soon' ? 'warning' : 'danger'})">${status.label}</span></div>
            <div class="meta-row"><span class="meta-label">موظف المشتريات</span><span class="meta-value">${escapeHtml(d.employee)}</span></div>
          </div>
          <div class="device-actions">
            <button class="icon-btn" onclick="editDevice('${d.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              تعديل
            </button>
            <button class="icon-btn danger" onclick="deleteDevice('${d.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              حذف
            </button>
          </div>
        </div>`;
    }).join('')}</div>`;
    container.innerHTML = html;
  };

  const escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  const renderAll = () => { renderStats(); renderDevices(); };

  // ====== Modal ======
  const openModal = (device = null) => {
    editingId = device ? device.id : null;
    $('#modalTitle').textContent = device ? 'تعديل بيانات الجهاز' : 'إضافة جهاز جديد';
    $('#deviceId').value = device?.id || '';
    $('#deviceName').value = device?.name || '';
    $('#deviceType').value = device?.type || 'laptop';
    $('#companyName').value = device?.company || '';
    $('#purchaseDate').value = device?.purchaseDate || '';
    $('#warrantyEnd').value = device?.warrantyEnd || '';
    $('#employeeName').value = device?.employee || '';
    $('#modalOverlay').classList.add('show');
    setTimeout(() => $('#deviceName').focus(), 100);
  };
  const closeModal = () => { $('#modalOverlay').classList.remove('show'); editingId = null; };

  // ====== Toast ======
  const showToast = (msg, type = 'success') => {
    const el = $('#toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => el.classList.remove('show'), 2400);
  };

  // ====== CRUD ======
  window.editDevice = (id) => {
    const d = devices.find(x => x.id === id);
    if (d) openModal(d);
  };
  window.deleteDevice = (id) => {
    const d = devices.find(x => x.id === id);
    if (!d) return;
    if (!confirm(`هل تريد حذف الجهاز "${d.name}"؟`)) return;
    devices = devices.filter(x => x.id !== id);
    saveDevices(devices);
    renderAll();
    showToast('تم حذف الجهاز', 'success');
  };

  $('#deviceForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const data = {
      id: editingId || uid(),
      name: $('#deviceName').value.trim(),
      type: $('#deviceType').value,
      company: $('#companyName').value.trim(),
      purchaseDate: $('#purchaseDate').value,
      warrantyEnd: $('#warrantyEnd').value,
      employee: $('#employeeName').value.trim(),
      updatedAt: new Date().toISOString()
    };
    if (new Date(data.warrantyEnd) < new Date(data.purchaseDate)) {
      showToast('تاريخ انتهاء الضمان يجب أن يكون بعد تاريخ الشراء', 'error');
      return;
    }
    if (editingId) {
      devices = devices.map(d => d.id === editingId ? { ...d, ...data } : d);
      showToast('تم تحديث بيانات الجهاز', 'success');
    } else {
      devices.unshift(data);
      showToast('تمت إضافة الجهاز بنجاح', 'success');
    }
    saveDevices(devices);
    renderAll();
    closeModal();
  });

  // ====== Events ======
  $('#addBtn').addEventListener('click', () => openModal());
  $('#modalClose').addEventListener('click', closeModal);
  $('#cancelBtn').addEventListener('click', closeModal);
  $('#modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modalOverlay').classList.contains('show')) closeModal();
  });

  $('#searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value.trim();
    renderDevices();
  });
  $('#filterGroup').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderDevices();
  });

  // Export / Import
  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(devices, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `warranty-devices-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('تم تصدير البيانات', 'success');
  });
  $('#importBtn').addEventListener('click', () => $('#importInput').click());
  $('#importInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported)) throw new Error();
        devices = imported.map(d => ({ ...d, id: d.id || uid() }));
        saveDevices(devices);
        renderAll();
        showToast(`تم استيراد ${devices.length} جهاز`, 'success');
      } catch {
        showToast('ملف غير صالح', 'error');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  // ====== PWA Install ======
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    $('#installBanner').classList.add('show');
  });
  $('#installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    $('#installBanner').classList.remove('show');
  });
  window.addEventListener('appinstalled', () => {
    $('#installBanner').classList.remove('show');
    showToast('تم تثبيت التطبيق بنجاح', 'success');
  });

  // Service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // Initial render
  renderAll();
</script>
</body>
</html>
